<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCP Ethics Observatory | Unified Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Fira+Code&display=swap');
        :root { --matrix-green: #22c55e; --sapolsky-red: #ef4444; --logic-gold: #fbbf24; --atcf-blue: #3b82f6; }
        body { background-color: #050505; color: #f8fafc; font-family: 'Inter', sans-serif; line-height: 1.5; }
        .hud-panel { border: 2px solid #1e293b; background: #0f172a; border-radius: 0.75rem; }
        canvas { background: #000; border: 1px solid #334155; width: 100%; height: 350px; border-radius: 0.5rem; }
        .logic-font { font-family: 'Fira Code', monospace; }
        .mode-btn { transition: all 0.3s ease; border: 1px solid #1e293b; }
        .mode-active { border-color: var(--atcf-blue); background: #1e3a8a; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .atcf-bar { height: 8px; border-radius: 4px; background: #1e293b; width: 100%; overflow: hidden; }
        .atcf-fill { height: 100%; transition: width 0.4s ease; }
    </style>
</head>
<body class="p-4 md:p-6">

    <div id="announcer" aria-live="assertive" class="sr-only"></div>

    <header class="max-w-7xl mx-auto mb-6 flex flex-col md:flex-row justify-between items-center gap-6">
        <h1 class="text-3xl font-black tracking-tighter">🔭 UCP <span class="text-blue-500">OBSERVATORY</span></h1>
        
        <nav class="flex gap-2" role="tablist" aria-label="Observatory Modes">
            <button onclick="setMode('timeline')" id="btn-timeline" class="mode-btn px-4 py-2 rounded text-[10px] font-bold uppercase tracking-widest">Developmental Timeline</button>
            <button onclick="setMode('pressure')" id="btn-pressure" class="mode-btn px-4 py-2 rounded text-[10px] font-bold uppercase tracking-widest mode-active">Pressure Response</button>
            <button onclick="setMode('cultural')" id="btn-cultural" class="mode-btn px-4 py-2 rounded text-[10px] font-bold uppercase tracking-widest">Cultural Pattern</button>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <aside class="lg:col-span-3 space-y-4">
            <div class="hud-panel p-5 overflow-y-auto max-h-[700px]">
                <h2 id="mode-title" class="text-blue-400 font-bold uppercase text-xs tracking-widest mb-4">Mode Instructions</h2>
                <div id="mode-help" class="text-[11px] text-slate-400 space-y-4 leading-relaxed">
                    </div>
            </div>
        </aside>

        <section class="lg:col-span-6 space-y-4">
            <div class="hud-panel p-6 relative">
                <div class="flex justify-between items-center mb-4">
                    <span id="state-tag" class="text-[10px] px-3 py-1 rounded bg-green-900 text-green-400 font-black">STABLE</span>
                    <div class="text-right">
                        <span class="text-[9px] text-slate-500 block font-bold uppercase tracking-widest">Morphic Debt ($D_{morph}$)</span>
                        <span id="debt-val" class="text-xl font-bold text-red-500">0.00</span>
                    </div>
                </div>
                <canvas id="treeCanvas" aria-hidden="true"></canvas>
                
                <div class="mt-6">
                    <label id="slider-label" for="main-slider" class="text-[10px] text-slate-400 font-bold uppercase block mb-2">Entropy Load</label>
                    <input type="range" id="main-slider" min="0" max="100" value="30" class="w-full accent-blue-500" oninput="updateUI()">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="hud-panel p-4">
                    <h3 class="text-[10px] font-bold text-slate-500 uppercase mb-4">PRF Calibration</h3>
                    <div class="space-y-3 text-[10px] logic-font">
                        <div class="flex justify-between"><span>c0: Root</span><input type="number" id="c0-val" value="1.0" step="0.1" onchange="updateUI()" class="bg-black text-center w-10 border border-slate-800"></div>
                        <div class="flex justify-between"><span>c1: Trunk</span><input type="number" id="c1-val" value="1.0" step="0.1" onchange="updateUI()" class="bg-black text-center w-10 border border-slate-800"></div>
                        <div class="flex justify-between"><span>cN: Leaf</span><input type="number" id="cN-val" value="1.0" step="0.1" onchange="updateUI()" class="bg-black text-center w-10 border border-slate-800"></div>
                    </div>
                </div>
                <div class="hud-panel p-4 flex flex-col justify-center text-center">
                    <span class="text-[9px] text-slate-500 uppercase font-bold">MA Index (Complexity)</span>
                    <span id="ma-val" class="text-3xl font-black text-white">--</span>
                </div>
            </div>
        </section>

        <section class="lg:col-span-3 space-y-4 flex flex-col">
            <div id="atcf-panel" class="hud-panel p-5">
                <h2 class="text-[10px] font-bold text-blue-400 mb-4 uppercase tracking-widest">ATCF Vector Audit</h2>
                <div class="space-y-4">
                    <div><div class="flex justify-between text-[10px] mb-1"><span>At (Past)</span><span id="at-per">--</span></div><div class="atcf-bar"><div id="at-fill" class="atcf-fill bg-blue-500"></div></div></div>
                    <div><div class="flex justify-between text-[10px] mb-1"><span>Tt (Now)</span><span id="tt-per">--</span></div><div class="atcf-bar"><div id="tt-fill" class="atcf-fill bg-yellow-500"></div></div></div>
                    <div><div class="flex justify-between text-[10px] mb-1"><span>Ct (Future)</span><span id="ct-per">--</span></div><div class="atcf-bar"><div id="ct-fill" class="atcf-fill bg-green-500"></div></div></div>
                </div>
            </div>

            <div class="hud-panel p-5 flex-grow">
                <h2 class="text-[10px] font-bold text-yellow-500 mb-4 uppercase tracking-widest italic">SAGE Audit Log</h2>
                <div id="log" class="text-[10px] space-y-3 logic-font overflow-y-auto h-[350px] pr-2">
                    <p class="text-slate-600">> Ready for Chapter 1 observation.</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        const canvas = document.getElementById('treeCanvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('main-slider');
        const logContainer = document.getElementById('log');
        let currentMode = 'pressure';

        const modeData = {
            pressure: {
                title: "Mode: Pressure Response (Ch 1, 2, 4)",
                help: `<strong>Goal:</strong> Find your Sapolsky Limit.<br><br>
                       1. Set your PRF values based on current sleep/stress.<br>
                       2. Move the entropy slider.<br>
                       3. Watch for 'Brownout' (Yellow) and 'Truncation' (Red).<br><br>
                       <strong>Inquiry:</strong> Can you sustain an MA Index > 15 under 70% pressure?`
            },
            timeline: {
                title: "Mode: Developmental Timeline (Interlude)",
                help: `<strong>Goal:</strong> Map your Refactoring Journey.<br><br>
                       1. Move the slider to view Childhood vs. Adult states.<br>
                       2. Observe the 'Entropic Trough' at 50% slider.<br>
                       3. Watch Tt (Present Integration) crash as you refactor.<br><br>
                       <strong>Inquiry:</strong> Where is your Ct (Future) vector strongest?`
            },
            cultural: {
                title: "Mode: Cultural Pattern (Ch 1, 3)",
                help: `<strong>Goal:</strong> Discover Identity Configurations.<br><br>
                       1. <strong>Discrete:</strong> High cN, Low c1.<br>
                       2. <strong>Distributed:</strong> Low cN, High c1.<br>
                       3. <strong>Blended:</strong> High c1 and cN.<br><br>
                       <strong>Inquiry:</strong> How does D-Morph change as you move c1?`
            }
        };

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('mode-active'));
            document.getElementById(`btn-${mode}`).classList.add('mode-active');
            document.getElementById('mode-title').innerText = modeData[mode].title;
            document.getElementById('mode-help').innerHTML = modeData[mode].help;
            document.getElementById('slider-label').innerText = mode === 'timeline' ? "Refactoring Axis" : "Entropy Load";
            updateUI();
        }

        function drawTree(x, y, len, angle, depth, color, thickness, rootScale) {
            ctx.beginPath(); ctx.moveTo(x, y);
            const x2 = x + Math.cos(angle) * len; const y2 = y + Math.sin(angle) * len;
            ctx.lineTo(x2, y2); ctx.strokeStyle = color;
            ctx.lineWidth = depth * thickness * (depth === 7 ? rootScale : 1);
            ctx.stroke();
            if (depth <= 0) return;
            drawTree(x2, y2, len * 0.76, angle - 0.35, depth - 1, color, thickness, rootScale);
            drawTree(x2, y2, len * 0.76, angle + 0.35, depth - 1, color, thickness, rootScale);
        }

        function updateUI() {
            const c0 = parseFloat(document.getElementById('c0-val').value) || 1.0;
            const c1 = parseFloat(document.getElementById('c1-val').value) || 1.0;
            const cN = parseFloat(document.getElementById('cN-val').value) || 1.0;
            const entropy = slider.value / 100;

            // ATCF Calculation
            const at = Math.max(10, 100 - (entropy * 50));
            const tt = Math.max(10, 100 - (Math.abs(0.5 - entropy) * 180));
            const ct = Math.min(100, entropy * 140);
            document.getElementById('at-fill').style.width = at + "%";
            document.getElementById('tt-fill').style.width = tt + "%";
            document.getElementById('ct-fill').style.width = ct + "%";

            // Morphic Debt Calculation
            const dMorph = Math.abs(((c0 + cN)/2) - c1).toFixed(2);
            document.getElementById('debt-val').innerText = dMorph;

            // MA Index logic
            const ma = Math.floor(15 + (cN * 5) - (entropy * 10) - (dMorph * 5));
            document.getElementById('ma-val').innerText = ma;

            // Visualization
            let state = entropy > 0.65 ? (entropy > 0.85 ? "TRUNCATED" : "BROWNOUT") : "STABLE";
            document.getElementById('state-tag').innerText = state;
            document.getElementById('state-tag').style.backgroundColor = state === "BROWNOUT" ? "#713f12" : (state === "TRUNCATED" ? "#7f1d1d" : "#064e3b");

            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            ctx.clearRect(0,0,canvas.width,canvas.height);
            let color = state === "BROWNOUT" ? "#fbbf24" : (state === "TRUNCATED" ? "#ef4444" : "#22c55e");
            drawTree(canvas.width / 2, canvas.height - 30, 65, -Math.PI / 2, 7, color, c1 * 1.5, c0 * 1.3);
            
            document.getElementById('budget-val').innerText = ( (100 * c0) - (entropy * 50) - (dMorph * 40) ).toFixed(0) + "J";
        }

        window.onload = () => { setMode('pressure'); updateUI(); };
    </script>
</body>
</html>
